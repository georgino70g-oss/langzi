<!DOCTYPE html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <title>Netlify form registration (not a public page)</title>
  </head>
  <body>
    <!--
      This file exists ONLY so that Netlify can detect the order form at deploy time.
      The visible form is rendered by React (src/pages/Checkout.tsx).
      Every field name below MUST match a field submitted by that React form.
      After changing any field here, redeploy the site.
    -->
    <form name="langzi-order" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="langzi-order" />
      <p hidden><label>Do not fill this out: <input name="bot-field" /></label></p>

      <input type="text" name="fullName" />
      <input type="tel" name="phone" />
      <input type="email" name="email" />
      <input type="text" name="address" />
      <input type="text" name="postalCode" />
      <input type="text" name="city" />
      <input type="text" name="region" />
      <textarea name="deliveryNotes"></textarea>
      <input type="text" name="deliveryMethod" />
      <input type="text" name="paymentMethod" />
      <textarea name="orderSummary"></textarea>
      <input type="text" name="totalShirts" />
      <input type="text" name="merchandiseSubtotal" />
      <input type="text" name="shippingStatus" />
      <input type="text" name="displayedTotal" />
      <input type="text" name="language" />
      <input type="text" name="consent" />
    </form>
  </body>
</html>
